<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen8 gallery</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { padding: 16px; }
    .g-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 auto 14px; max-width: 760px; }
    .g-id { font: 600 12px/1.4 ui-monospace, monospace; color: var(--muted); margin-bottom: 6px; }
    .g-q { font-size: 14px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main id="g"></main>
  <script type="module">
    import { renderVisual } from '../js/ui/visuals.js';
    import { mathsDiagram } from '../js/ui/diagrams.js';
    import { makeRng } from '../js/core/rng.js';
    import { Y8_COMPUTING_GENERATORS as C } from '../js/gen/y8computing.js';
    import { Y8_MATHS_GENERATORS as M } from '../js/gen/y8maths.js';
    import { Y8_MATHS2_GENERATORS as M2 } from '../js/gen/y8maths2.js';
    import { Y8_SCIENCE_GENERATORS as S } from '../js/gen/y8science.js';
    const ALL = { ...C, ...M, ...M2, ...S };
    const q = new URLSearchParams(location.search);
    const names = (q.get('gens') || '').split(',').filter(Boolean);
    const per = Number(q.get('per') || 3);
    const root = document.getElementById('g');
    let count = 0;
    for (const name of names) for (const level of [1, 2, 3]) {
      const seen = new Map();
      for (let seed = 0; seed < 200; seed++) {
        const g = ALL[name](level, makeRng(`gal:${name}:${level}:${seed}`));
        if (!g.visual && !g.diagram) continue;
        const sig = (g.diagram ? 'D' : '') + [].concat(g.visual || []).map((v) => v.kind + (v.diagram?.type || '')).join() + g.prompt.replace(/[\d−-]+/g, '#').slice(0, 30);
        if ((seen.get(sig) || 0) >= per) continue;
        seen.set(sig, (seen.get(sig) || 0) + 1);
        const c = document.createElement('section'); c.className = 'g-card'; c.dataset.id = `${name}-L${level}-s${seed}`;
        const t = document.createElement('div'); t.className = 'g-id'; t.textContent = c.dataset.id;
        const p = document.createElement('div'); p.className = 'g-q'; p.textContent = g.prompt + '  →  ' + (g.numeric?.value ?? g.answer ?? g.options?.find((o) => o.correct)?.text);
        c.append(t, p);
        if (g.diagram) { const h = document.createElement('div'); h.className = 'g-id'; h.textContent = 'IN QUESTION:'; c.append(h, mathsDiagram(g.diagram)); }
        if (g.visual) { const h = document.createElement('div'); h.className = 'g-id'; h.textContent = 'FEEDBACK:'; c.append(h, renderVisual(g.visual)); }
        root.append(c); count++;
      }
    }
    window.__gallery = { errors: [], count };
  </script>
</body>
</html>
