<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generated pictures</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { padding: 16px; }
    .g-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 auto 14px; max-width: 760px; }
    .g-id { font: 600 12px/1.4 ui-monospace, monospace; color: var(--muted); margin-bottom: 6px; }
  </style>
</head>
<body>
  <!-- Scratch page (delete after use): pictures on generated questions, drawn as the app draws them. -->
  <main id="g"></main>
  <script type="module">
    import { renderVisual } from '../js/ui/visuals.js';
    import { rich } from '../js/ui/dom.js';
    import { GENERATORS } from '../js/gen/index.js';
    import { makeRng } from '../js/core/rng.js';
    const q = new URLSearchParams(location.search);
    const names = (q.get('gens') || '').split(',').filter(Boolean);
    const root = document.getElementById('g');
    const errors = [];
    let count = 0;
    for (const name of names) for (const level of [1, 2, 3]) {
      // a few samples per level: the first one with a picture, then the biggest pictures of each type
      const found = [];
      for (let seed = 0; seed < 300; seed++) {
        const qn = GENERATORS[name](level, makeRng(`genvis:${name}:${level}:${seed}`));
        if (qn.visual) found.push([seed, qn]);
      }
      const byType = {};
      for (const f of found) { const t = f[1].visual.diagram.type; const size = JSON.stringify(f[1].visual).length; if (!byType[t] || size > byType[t][2]) byType[t] = [...f, size]; }
      const picks = new Map();
      if (found[0]) picks.set(found[0][0], found[0][1]);
      for (const [seed, qn] of Object.values(byType)) picks.set(seed, qn);
      if (q.get('stress')) for (const [seed, qn] of [...found].sort((a, b) => JSON.stringify(b[1].visual).length - JSON.stringify(a[1].visual).length).slice(0, 8)) picks.set(seed, qn);
      for (const [seed, qn] of [...picks].slice(0, +(q.get('per') || 3))) {
        const c = document.createElement('section'); c.className = 'g-card'; c.dataset.id = `${name}-L${level}-s${seed}`;
        const t = document.createElement('div'); t.className = 'g-id'; t.textContent = `${name} L${level} seed ${seed}`;
        c.append(t, rich('p', qn.prompt.replaceAll('{hero}', 'Captain Comet')), renderVisual(qn.visual) || document.createTextNode('(nothing drawn)'));
        root.append(c); count++;
      }
    }
    // text that spills out of its drawing, or two labels on top of each other
    for (const svg of document.querySelectorAll('.g-card svg')) {
      const id = svg.closest('.g-card').dataset.id;
      const [, , W, H] = svg.getAttribute('viewBox').split(' ').map(Number);
      const boxes = [...svg.querySelectorAll('text')].map((t) => [t.textContent, t.getBBox()]);
      for (const [txt, b] of boxes) if (b.x < -1 || b.y < -1 || b.x + b.width > W + 1 || b.y + b.height > H + 1) errors.push(`${id}: "${txt}" outside the drawing`);
      for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
        const [ta, a] = boxes[i], [tb, b] = boxes[j];
        const ox = Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x), oy = Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y);
        if (ox > 1 && oy > 3) errors.push(`${id}: "${ta}" overlaps "${tb}"`);
      }
    }
    // box labels wider than their box (bar models and area models)
    for (const svg of document.querySelectorAll('.g-card svg')) {
      const id = svg.closest('.g-card').dataset.id;
      const rects = [...svg.querySelectorAll('rect')].map((r) => r.getBBox());
      for (const t of svg.querySelectorAll('text')) {
        const b = t.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2;
        const host = rects.find((r) => cx > r.x && cx < r.x + r.width && cy > r.y && cy < r.y + r.height && r.width < 200);
        if (host && b.width > host.width - 2) errors.push(`${id}: "${t.textContent}" wider than its box`);
      }
    }
    window.__gallery = { errors, count };
  </script>
</body>
</html>
